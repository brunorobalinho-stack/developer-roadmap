name: Sends Daily AWS Costs to Slack
on:
  # Allow manual Run
  workflow_dispatch:
  # Schedule disabled - fork does not have required AWS/Slack secrets
  # (COST_AWS_ACCESS_KEY, COST_AWS_SECRET_KEY, COST_AWS_REGION, SLACK_COST_CHANNEL, SLACK_TOKEN)
  # To re-enable, uncomment the schedule block below and configure the secrets.
  # schedule:
  #   - cron: "0 7 * * *"
jobs:
  aws_costs:
    runs-on: ubuntu-latest
    steps:
      - name: Get Costs
        env:
          AWS_KEY: ${{ secrets.COST_AWS_ACCESS_KEY }}
          AWS_SECRET: ${{ secrets.COST_AWS_SECRET_KEY }}
          AWS_REGION: ${{ secrets.COST_AWS_REGION }}
          SLACK_CHANNEL: ${{ secrets.SLACK_COST_CHANNEL }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: |
          npm install -g aws-cost-cli
          aws-cost -k $AWS_KEY -s $AWS_SECRET -r $AWS_REGION -S $SLACK_TOKEN -C $SLACK_CHANNEL
